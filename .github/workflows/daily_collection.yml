name: Daily collection

on:
  schedule:
    - cron: "17 19 * * *"  # 19:17 UTC = early morning in Sydney; off the hour, when GitHub queues are busy
    - cron: "17 3 * * *"   # fallback 8 h later: collects only if the day has no successful run yet
  workflow_dispatch:

permissions:
  id-token: write  # OIDC token for the Azure login (DR-005)
  contents: read
  actions: read    # the guard reads today's earlier runs

concurrency:
  group: daily-collection

env:
  TZ: Australia/Sydney  # snapshot date is the Sydney date, as for runs on the PC
  RG: rg-bank-tracker
  SQL_SERVER: ayush-bank-tracker-sql
  AZURE_SQL_SERVER: ayush-bank-tracker-sql.database.windows.net
  AZURE_SQL_DATABASE: bank_tracker
  AZURE_SQL_USER: loader

jobs:
  guard:  # a scheduled run skips a Sydney day that already has a successful run; manual runs always collect
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d "@$(date -d "$(date +%F)" +%s)" +%FT%TZ)  # Sydney midnight in UTC
          ok_runs=$(gh run list -R "$GITHUB_REPOSITORY" -w daily_collection.yml -s success --created ">=$since" --json databaseId -q length || echo 0)  # API error: collect anyway
          echo "skip=$([ "$GITHUB_EVENT_NAME" = schedule ] && [ "$ok_runs" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  collect-and-load:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-24.04  # pinned: the ODBC driver package must exist for the Ubuntu version
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ODBC Driver 18 if missing
        run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" > /dev/null 2>&1; then
            curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi

      - run: pip install -r requirements.txt

      - name: Collect Register and RBA cash rate
        run: python -u src/get_register.py && python -u src/get_cash_rate.py

      - name: Collect products
        run: python -u src/get_products.py

      - name: Keep raw files for 90 days (to reload by hand if the load fails)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 90

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open firewall for this runner only
        id: firewall
        run: |
          ip=$(curl -sSf https://api.ipify.org)
          az sql server firewall-rule create -g "$RG" -s "$SQL_SERVER" -n "github-run-${{ github.run_id }}" \
            --start-ip-address "$ip" --end-ip-address "$ip" -o none

      - name: Load into Azure SQL
        env:
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python -u src/load_raw.py

      - name: Close firewall
        if: always() && steps.firewall.outcome != 'skipped'
        run: az sql server firewall-rule delete -g "$RG" -s "$SQL_SERVER" -n "github-run-${{ github.run_id }}"
